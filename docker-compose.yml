services:
  iusfully_ai:
    build:
      context: .
    image: iusfully_ai:latest
    container_name: ${ENV_NAME}_iusfully_ai
    restart: unless-stopped
    user: '0:0'
    env_file:
      - .env
    ports:
      - "${APP_PORT}:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - default
      - iusfully_db
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  iusfully_db:
    external: true
    name: iusfully_iusfully_net
