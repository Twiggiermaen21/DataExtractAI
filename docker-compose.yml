services:
  app:
    build:
      context: .
    image: dataextractai:latest
    container_name: dataextractai
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "40107:5000"
    volumes:
      - ./input:/app/input
      - ./output:/app/output
      - ./saved:/app/saved
    extra_hosts:
      - "host.docker.internal:host-gateway"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:5000/healthz', timeout=3).read()"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s