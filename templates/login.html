<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iusfully — Logowanie</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Outfit', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #121316;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      -webkit-font-smoothing: antialiased;
      overflow: hidden;
    }

    /* Animated background */
    .bg-glow {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .bg-glow::before,
    .bg-glow::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      filter: blur(120px);
      opacity: 0.15;
      animation: floatGlow 12s ease-in-out infinite alternate;
    }

    .bg-glow::before {
      width: 500px;
      height: 500px;
      background: #6366f1;
      top: -10%;
      right: -5%;
    }

    .bg-glow::after {
      width: 400px;
      height: 400px;
      background: #eecf6d;
      bottom: -10%;
      left: -5%;
      animation-delay: -6s;
    }

    @keyframes floatGlow {
      0%   { transform: translate(0, 0) scale(1); }
      100% { transform: translate(40px, -30px) scale(1.15); }
    }

    /* Login card */
    .login-container {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 420px;
      padding: 20px;
    }

    .login-card {
      background: rgba(26, 27, 31, 0.85);
      backdrop-filter: blur(40px);
      -webkit-backdrop-filter: blur(40px);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 24px;
      padding: 48px 40px 40px;
      box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      animation: cardSlideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      opacity: 0;
      transform: translateY(30px);
    }

    @keyframes cardSlideUp {
      to { opacity: 1; transform: translateY(0); }
    }

    /* Logo */
    .login-logo {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      margin-bottom: 36px;
    }

    .login-logo-icon {
      width: 52px;
      height: 52px;
      border: 2px solid #eecf6d;
      border-radius: 14px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-shrink: 0;
    }

    .login-logo-icon img {
      width: 34px;
      height: 34px;
    }

    .login-logo-text {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.02em;
    }

    /* Heading */
    .login-heading {
      text-align: center;
      margin-bottom: 32px;
    }

    .login-heading h2 {
      font-size: 22px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }

    .login-heading p {
      font-size: 14px;
      color: rgba(255, 255, 255, 0.45);
      line-height: 1.5;
    }

    /* Form */
    .form-group {
      margin-bottom: 20px;
    }

    .form-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.6);
      margin-bottom: 8px;
      letter-spacing: 0.02em;
    }

    .form-input-wrapper {
      position: relative;
      display: flex;
      align-items: center;
    }

    .form-input-icon {
      position: absolute;
      left: 16px;
      color: rgba(255, 255, 255, 0.3);
      pointer-events: none;
      transition: color 0.3s;
    }

    .form-input {
      width: 100%;
      height: 50px;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      padding: 0 16px 0 48px;
      color: #ffffff;
      font-size: 15px;
      font-family: inherit;
      outline: none;
      transition: all 0.3s ease;
    }

    .form-input::placeholder {
      color: rgba(255, 255, 255, 0.25);
    }

    .form-input:focus {
      border-color: #eecf6d;
      background: rgba(238, 207, 109, 0.04);
      box-shadow: 0 0 0 3px rgba(238, 207, 109, 0.08);
    }

    .form-input:focus ~ .form-input-icon,
    .form-input:focus + .form-input-icon {
      color: #eecf6d;
    }

    .toggle-password {
      position: absolute;
      right: 14px;
      background: none;
      border: none;
      color: rgba(255, 255, 255, 0.3);
      cursor: pointer;
      padding: 4px;
      display: flex;
      transition: color 0.2s;
    }

    .toggle-password:hover {
      color: rgba(255, 255, 255, 0.7);
    }

    /* Submit button */
    .login-btn {
      width: 100%;
      height: 52px;
      background: linear-gradient(135deg, #eecf6d 0%, #d4a843 100%);
      border: none;
      border-radius: 14px;
      color: #121316;
      font-size: 16px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.3s ease;
      margin-top: 8px;
      position: relative;
      overflow: hidden;
    }

    .login-btn::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.15) 0%, transparent 50%);
      opacity: 0;
      transition: opacity 0.3s;
    }

    .login-btn:hover::before { opacity: 1; }

    .login-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(238, 207, 109, 0.3);
    }

    .login-btn:active {
      transform: translateY(0);
      box-shadow: none;
    }

    .login-btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
      transform: none;
      box-shadow: none;
    }

    .login-btn .btn-text { position: relative; z-index: 1; }

    .login-btn .spinner {
      display: none;
      width: 22px;
      height: 22px;
      border: 2.5px solid rgba(18, 19, 22, 0.25);
      border-top-color: #121316;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto;
      position: relative;
      z-index: 1;
    }

    .login-btn.loading .btn-text { display: none; }
    .login-btn.loading .spinner { display: block; }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error message */
    .login-error {
      background: rgba(239, 68, 68, 0.08);
      border: 1px solid rgba(239, 68, 68, 0.2);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 20px;
      display: none;
      align-items: center;
      gap: 10px;
      font-size: 14px;
      color: #fca5a5;
      animation: shakeError 0.4s ease;
    }

    .login-error.visible { display: flex; }

    .login-error svg { flex-shrink: 0; }

    @keyframes shakeError {
      0%, 100% { transform: translateX(0); }
      20%      { transform: translateX(-6px); }
      40%      { transform: translateX(6px); }
      60%      { transform: translateX(-4px); }
      80%      { transform: translateX(4px); }
    }

    /* Footer text */
    .login-footer {
      text-align: center;
      margin-top: 28px;
      font-size: 13px;
      color: rgba(255, 255, 255, 0.25);
    }
  </style>
</head>

<body>
  <div class="bg-glow"></div>

  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <div class="login-logo-icon">
          <img src="{{ url_for('static', filename='logo.png') }}" alt="Logo">
        </div>
        <span class="login-logo-text">iusfully</span>
      </div>

      <div class="login-heading">
        <h2>Zaloguj się</h2>
        <p>Wprowadź dane logowania, aby kontynuować</p>
      </div>

      <div class="login-error" id="loginError">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"></circle>
          <line x1="15" y1="9" x2="9" y2="15"></line>
          <line x1="9" y1="9" x2="15" y2="15"></line>
        </svg>
        <span id="loginErrorText"></span>
      </div>

      <form id="loginForm" autocomplete="on">
        <div class="form-group">
          <label class="form-label" for="email">Adres email</label>
          <div class="form-input-wrapper">
            <input 
              type="email" 
              id="email" 
              name="email"
              class="form-input" 
              placeholder="Wpisz adres email" 
              autocomplete="email"
              required
            >
            <svg class="form-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label" for="password">Hasło</label>
          <div class="form-input-wrapper">
            <input 
              type="password" 
              id="password" 
              name="password"
              class="form-input" 
              placeholder="Wpisz hasło"
              autocomplete="current-password"
              required
            >
            <svg class="form-input-icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"></rect>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"></path>
            </svg>
            <button type="button" class="toggle-password" id="togglePassword" tabindex="-1">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                <circle cx="12" cy="12" r="3"></circle>
              </svg>
            </button>
          </div>
        </div>

        <button type="submit" class="login-btn" id="loginBtn">
          <span class="btn-text">Zaloguj się</span>
          <div class="spinner"></div>
        </button>
      </form>

      <div class="login-footer">
        iusfully &copy; 2026 — DataExtractAI
      </div>
    </div>
  </div>

  <script>
    // If already logged in, redirect to main page
    (function() {
      const token = localStorage.getItem('access_token');
      if (token) {
        window.location.replace('/');
      }
    })();

    // Toggle password visibility
    document.getElementById('togglePassword').addEventListener('click', function() {
      const passwordInput = document.getElementById('password');
      const isPassword = passwordInput.type === 'password';
      passwordInput.type = isPassword ? 'text' : 'password';
      this.innerHTML = isPassword
        ? '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>'
        : '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>';
    });

    // Login form submission
    document.getElementById('loginForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const btn = document.getElementById('loginBtn');
      const errorEl = document.getElementById('loginError');
      const errorText = document.getElementById('loginErrorText');
      const emailField = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      // Hide previous errors
      errorEl.classList.remove('visible');

      if (!emailField || !password) {
        errorText.textContent = 'Wypełnij wszystkie pola';
        errorEl.classList.add('visible');
        return;
      }

      // Show loading state
      btn.classList.add('loading');
      btn.disabled = true;

      try {
        const response = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: emailField, password }),
        });

        const data = await response.json();

        if (response.ok && data.success) {
          // Save tokens
          localStorage.setItem('access_token', data.access);
          localStorage.setItem('refresh_token', data.refresh);
          localStorage.setItem('user', JSON.stringify(data.user));

          // Redirect to main page
          window.location.replace('/');
        } else {
          errorText.textContent = data.error || 'Nieprawidłowy login lub hasło';
          errorEl.classList.add('visible');
        }
      } catch (err) {
        errorText.textContent = 'Błąd połączenia z serwerem';
        errorEl.classList.add('visible');
      } finally {
        btn.classList.remove('loading');
        btn.disabled = false;
      }
    });

    // Auto-focus email field
    document.getElementById('email').focus();
  </script>
</body>

</html>
