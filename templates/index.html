<!DOCTYPE html>
<html lang="pl">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>iusfully</title>
  <link rel="icon" type="image/png" href="{{ url_for('static', filename='logo.png') }}">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}?v=20260714-ocr-logs">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}?v=20260714-ocr-logs">
  <link rel="stylesheet" href="{{ url_for('static', filename='css/advanced.css') }}?v=20260714-ocr-logs">
  <script>
    // Auth gate — redirect to /login BEFORE body renders if no token
    if (!localStorage.getItem('access_token')) {
      window.location.replace('/login');
      document.write('<body style="display:none">');
    }
  </script>
</head>

<body>
  <div class="app-layout">
    {% include 'components/sidebar.html' %}

    <div class="main-content">
      {% include 'components/header.html' %}

      <div class="dashboard-content" id="dashboard-welcome">
        {% include 'components/welcome.html' %}
      </div>

      <div class="dashboard-content content-padded hidden" id="dashboard-advanced">
        {% include 'components/tab_advanced.html' %}
      </div>


    </div>
  </div>

  <script src="{{ url_for('static', filename='js/auth.js') }}?v=20260719-auth"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="{{ url_for('static', filename='js/helpers.js') }}?v=20260719-auth"></script>
  <script src="{{ url_for('static', filename='js/ocr.js') }}?v=20260714-ocr-logs"></script>
  <script src="{{ url_for('static', filename='js/advanced.js') }}?v=20260714-ocr-logs"></script>
  <script src="{{ url_for('static', filename='js/pozew-process.js') }}?v=20260714-ocr-logs"></script>

  <!-- Modal Podglądu -->
  <div id="previewModal" class="modal">
    <div class="modal-overlay" onclick="closeModal()"></div>
    <div class="modal-container">
      <div class="modal-header">
        <h3 id="modalTitle">Podgląd dokumentu</h3>
        <button class="close-btn" onclick="closeModal()">✕</button>
      </div>
      <div class="modal-body" id="modalBody">
        <!-- Zawartość podglądu -->
      </div>
    </div>
  </div>
</body>

</html>
